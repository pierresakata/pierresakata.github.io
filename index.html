<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WONDER ROOM — App Developer</title>
  <meta name="description" content="WONDER ROOM が開発する、シンプルで使いやすいAndroidアプリ">
  <meta property="og:title" content="WONDER ROOM">
  <meta property="og:description" content="シンプルで使いやすいアプリを、丁寧に。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pierresakata.github.io/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0f;
      --surface: #141418;
      --surface-hover: #1a1a20;
      --border: rgba(255, 255, 255, 0.06);
      --text: #e8e8ec;
      --text-muted: #888894;
      --accent: #c4a882;
      --accent-soft: rgba(196, 168, 130, 0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(196, 168, 130, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(100, 100, 140, 0.05), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 80px 0 64px;
      text-align: center;
    }

    .brand {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: var(--text);
      margin-bottom: 16px;
    }

    .tagline {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--accent);
      margin: 32px auto 0;
      opacity: 0.6;
    }

    .about {
      text-align: center;
      max-width: 520px;
      margin: 0 auto 72px;
    }

    .about p {
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.9;
    }

    section h2 {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 32px;
      text-align: center;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 80px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background 0.25s, border-color 0.25s, transform 0.25s;
    }

    .app-card:hover {
      background: var(--surface-hover);
      border-color: rgba(196, 168, 130, 0.2);
      transform: translateY(-2px);
    }

    .app-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: cover;
      margin-bottom: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .app-name {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
    }

    .app-desc {
      font-size: 0.82rem;
      font-weight: 300;
      color: var(--text-muted);
      flex: 1;
    }

    .store-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      width: fit-content;
    }

    .store-link:hover {
      background: var(--accent-soft);
      border-color: rgba(196, 168, 130, 0.3);
      color: var(--accent);
    }

    .store-link svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    footer {
      text-align: center;
      padding: 40px 0 48px;
      border-top: 1px solid var(--border);
    }

    footer p {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      header { padding: 56px 0 48px; }
      .apps { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="brand">WONDER ROOM</h1>
      <p class="tagline">App Developer</p>
      <div class="divider"></div>
    </header>

    <div class="about">
      <p>
        日常の「ちょっと不便」を、シンプルなアプリで解決する。<br>
        必要な機能だけを、丁寧に。
      </p>
    </div>

    <section>
      <h2>Apps</h2>
      <div class="apps">

        <article class="app-card">
          <img class="app-icon" src="images/expense-memo.png" alt="家計簿: シンプルな支出管理「支出メモ」" width="52" height="52">

            Google Play

        <article class="app-card">
          <img class="app-icon" src="images/roulette.png" alt="ルーレット" width="52" height="52">
          <h3 class="app-name">ルーレット</h3>
          <p class="app-desc">迷ったときに。直感的に使えるルーレットアプリ。</p>
          <a class="store-link" href="https://play.google.com/store/apps/details?id=com.pierretmks.roulette" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/></svg>
            Google Play
          </a>
        </article>

        <article class="app-card">
          <img class="app-icon" src="images/counter.png" alt="カウンター" width="52" height="52">
          <h3 class="app-name">カウンター</h3>
          <p class="app-desc">数えるためのシンプル＆無料の数取りアプリ。</p>
          <a class="store-link" href="https://play.google.com/store/apps/details?id=com.pierretmks.counter" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/></svg>
            Google Play
          </a>
        </article>

        <article class="app-card">
          <img class="app-icon" src="images/minimal-kakeibo.png" alt="ミニマル家計簿" width="52" height="52">
          <h3 class="app-name">ミニマル家計簿</h3>
          <p class="app-desc">「あといくら？」でお小遣い管理。ミニマル設計の家計簿。</p>
          <a class="store-link" href="https://play.google.com/store/apps/details?id=jp.pierretmks.expenserecord" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/></svg>
            Google Play
          </a>
        </article>

      </div>
    </section>

    <footer>
      <p>&copy; WONDER ROOM</p>
    </footer>
  </div>
</body>
</html>
